name: Integration-Tests
description: |
  Runs Integrationtests using TestMachinery

on:
  # only run manually, as integrationtest-workflow will not yet work
  workflow_dispatch:

jobs:
  integrationtest:
    permissions:
      id-token: write
      contents: read
    uses: gardener/cc-utils/.github/workflows/run-testmachinery-tests.yaml@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
    with:
      test-command: |
        set -euo pipefail
        .ci/test
