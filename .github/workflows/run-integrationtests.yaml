name: Integration-Tests
description: |
  Runs Integrationtests using TestMachinery

on:
  # only run manually, as integrationtest-workflow will not yet work
  workflow_dispatch:

jobs:
  integrationtest:
    permissions:
      id-token: write
      contents: read
    uses: gardener/cc-utils/.github/workflows/run-testmachinery-tests.yaml@00522ef3e8504bc7be46394a239a390f112336f6 # 1.2883.0
    with:
      test-command: |
        set -euo pipefail
        .ci/test
