name: Integration-Tests
description: |
  Runs Integrationtests using TestMachinery

on:
  # only run manually, as integrationtest-workflow will not yet work
  workflow_dispatch:

jobs:
  integrationtest:
    permissions:
      id-token: write
      contents: read
    uses: gardener/cc-utils/.github/workflows/run-testmachinery-tests.yaml@bce63f62928717a11f610ec8022af9feb497d5df # v1
    with:
      test-command: |
        set -euo pipefail
        .ci/test
